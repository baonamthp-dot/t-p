name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'music-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate Gradle wrapper
        run: gradle -p music-app wrapper --gradle-version 8.9

      - name: Prepare app icon
        working-directory: music-app
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/icon/app_icon.b64 > app/src/main/res/drawable-nodpi/app_icon.jpg
          test -s app/src/main/res/drawable-nodpi/app_icon.jpg

      - name: Build debug APK
        env:
          OPENAI_BACKEND_URL: ${{ vars.OPENAI_BACKEND_URL || vars.GEMINI_BACKEND_URL }}
        run: cd music-app && ./gradlew assembleDebug -POPENAI_BACKEND_URL="$OPENAI_BACKEND_URL"

      - name: Verify APK exists
        run: test -s music-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-debug-apk
          path: music-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
