name: Test AI Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/test-ai-backend.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/test-ai-backend.yml'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check chat endpoint syntax
        run: node --check api/openai-chat.js

      - name: Check speech endpoint syntax
        run: node --check api/openai-speech.js
