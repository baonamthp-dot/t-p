<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Time Bomb Duels</title>
<style>
:root{--bg:#090d18;--panel:#121a2b;--text:#f4f7ff;--muted:#9eabc7;--p1:#5aa9ff;--p2:#ff6d8a;--accent:#ffd34d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#18233c,#090d18 65%);font-family:system-ui,sans-serif;color:var(--text);min-height:100vh;display:grid;place-items:center;padding:10px;touch-action:none}
.wrap{width:min(980px,100%)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.title{font-size:clamp(24px,5vw,42px);font-weight:900}.sub{color:var(--muted);font-size:13px}.score{display:flex;gap:8px}.score span{padding:7px 10px;border-radius:10px;background:var(--panel);font-weight:800}
.game{background:#0e1525;border:1px solid #293653;border-radius:22px;padding:10px;box-shadow:0 18px 50px #0008}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:8px}.bar{height:10px;background:#202b43;border-radius:99px;overflow:hidden}.fill{height:100%;width:100%}.p1 .fill{background:var(--p1)}.p2 .fill{background:var(--p2)}.timer{font-size:30px;font-weight:1000;min-width:90px;text-align:center;color:var(--accent)}.danger{animation:pulse .35s infinite alternate;color:#ff667c}@keyframes pulse{to{transform:scale(1.08)}}
.arena{position:relative;aspect-ratio:16/9;min-height:300px;overflow:hidden;border-radius:17px;background:linear-gradient(#142038,#0b1220);border:1px solid #2a3854}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px}.wall{position:absolute;background:#273650;border-radius:12px}.w1{left:24%;top:25%;width:16%;height:9%}.w2{right:24%;top:66%;width:16%;height:9%}.w3{left:45%;top:46%;width:10%;height:9%}
.player{position:absolute;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:1000;box-shadow:0 7px 18px #0008;user-select:none}.one{background:var(--p1)}.two{background:var(--p2)}.bomb{position:absolute;width:31px;height:31px;border-radius:50%;background:#202532;border:4px solid var(--accent);display:grid;place-items:center;font-size:16px;box-shadow:0 0 18px #ffd34d99;z-index:5}.bomb:after{content:"";position:absolute;width:8px;height:8px;background:#ff6578;border-radius:50%;top:-5px;right:-2px}.toast{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(22px,5vw,48px);font-weight:1000;text-shadow:0 5px 20px #000;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.card{background:var(--panel);border:1px solid #273653;border-radius:14px;padding:8px 12px}.card b{display:block}.keys{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#e8edf8;color:#101522;font-weight:900;min-height:44px}.btn.secondary{background:#202c44;color:#fff}.note{margin-top:8px;text-align:center;color:var(--muted);font-size:12px}
.joy{position:absolute;left:18px;bottom:18px;width:112px;height:112px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff35;z-index:10;display:grid;place-items:center;touch-action:none}.stick{width:48px;height:48px;border-radius:50%;background:#ffffff55;border:2px solid #fff8;position:absolute;left:30px;top:30px;pointer-events:none}.aiBadge{position:absolute;right:12px;top:10px;background:#0008;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:800;z-index:8}
@media(max-width:650px){.hud{grid-template-columns:1fr 70px 1fr}.timer{font-size:24px;min-width:0}.player{width:36px;height:36px}.bomb{width:28px;height:28px}.arena{min-height:270px}.card{padding:7px 9px}.joy{width:104px;height:104px;left:12px;bottom:12px}.stick{left:28px;top:28px}}
</style>
</head>
<body>
<main class="wrap">
<header><div><div class="title">💣 Time Bomb Duels</div><div class="sub">Bạn đấu với AI • Chạm để chuyền bom</div></div><div class="score"><span id="s1">Bạn 0</span><span id="s2">AI 0</span></div></header>
<section class="game">
<div class="hud"><div class="p1"><div class="bar"><div class="fill" id="b1"></div></div></div><div class="timer" id="timer">12.0</div><div class="p2"><div class="bar"><div class="fill" id="b2"></div></div></div></div>
<div class="arena" id="arena">
<div class="grid"></div><div class="wall w1"></div><div class="wall w2"></div><div class="wall w3"></div>
<div class="aiBadge">🤖 AI đang chơi</div>
<div class="player one" id="p1">Bạn</div><div class="player two" id="p2">AI</div><div class="bomb" id="bomb">💣</div>
<div class="toast" id="toast"></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
</div>
<div class="controls"><div class="card"><b>🔵 Bạn</b><div class="keys">Kéo joystick để di chuyển</div></div><div class="card"><b>🔴 AI</b><div class="keys">AI tự điều khiển</div></div></div>
<div class="actions"><button class="btn" id="start">Bắt đầu round</button><button class="btn secondary" id="reset">Reset điểm</button></div>
<div class="note">Khi đồng hồ về 0, người đang giữ bom thua round. Cơ chế hoàn toàn hư cấu trong game.</div>
</section>
</main>
<script>
(()=>{const arena=document.querySelector('#arena'),p1=document.querySelector('#p1'),p2=document.querySelector('#p2'),bomb=document.querySelector('#bomb'),timer=document.querySelector('#timer'),toast=document.querySelector('#toast'),b1=document.querySelector('#b1'),b2=document.querySelector('#b2'),s1=document.querySelector('#s1'),s2=document.querySelector('#s2'),start=document.querySelector('#start'),reset=document.querySelector('#reset'),joy=document.querySelector('#joy'),stick=document.querySelector('#stick');
const st={running:false,owner:1,time:12,last:0,scores:[0,0],pos:[{x:14,y:50},{x:86,y:50}],input:{x:0,y:0},aiThink:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function draw(){const w=arena.clientWidth,h=arena.clientHeight;st.pos.forEach((q,i)=>{const e=i?p2:p1;e.style.left=(q.x/100*w-e.offsetWidth/2)+'px';e.style.top=(q.y/100*h-e.offsetHeight/2)+'px'});const q=st.pos[st.owner-1];bomb.style.left=(q.x/100*w-bomb.offsetWidth/2)+'px';bomb.style.top=(q.y/100*h-bomb.offsetHeight/2)+'px';b1.style.width=(st.owner===1?100:0)+'%';b2.style.width=(st.owner===2?100:0)+'%';timer.textContent=Math.max(0,st.time).toFixed(1);timer.classList.toggle('danger',st.time<4)}
function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),850)}
function begin(){st.running=true;st.time=10+Math.random()*4;st.owner=Math.random()<.5?1:2;st.pos=[{x:14,y:50},{x:86,y:50}];st.last=performance.now();st.aiThink=0;start.textContent='Đang đấu…';msg(st.owner===1?'💣 BẠN CẦM BOM':'💣 AI CẦM BOM');draw()}
function finish(){const loser=st.owner,winner=loser===1?2:1;st.scores[winner-1]++;s1.textContent='Bạn '+st.scores[0];s2.textContent='AI '+st.scores[1];st.running=false;start.textContent='Round tiếp theo';msg(winner===1?'🏆 BẠN THẮNG!':'🤖 AI THẮNG!');draw()}
function updateAI(dt){const me=st.pos[1],human=st.pos[0];const target=st.owner===2?human:human;let dx=target.x-me.x,dy=target.y-me.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
if(st.owner===2){if(d<12){dx=-dx;dy=-dy}}else{if(d<18){dx=dx;dy=dy}}
const speed=st.owner===2?21:24;me.x=clamp(me.x+dx*speed*dt,5,95);me.y=clamp(me.y+dy*speed*dt,7,93)}
function loop(now){if(st.running){const dt=Math.min(.04,(now-st.last)/1000);st.last=now;st.time-=dt;
const h=st.pos[0],dx=st.input.x,dy=st.input.y,m=Math.hypot(dx,dy);if(m>.05){h.x=clamp(h.x+dx/m*27*dt,5,95);h.y=clamp(h.y+dy/m*27*dt,7,93)}
updateAI(dt);
if(dist(st.pos[0],st.pos[1])<7){st.owner=st.owner===1?2:1;st.time=Math.max(st.time,3.5);msg(st.owner===1?'💣 Bạn nhận bom!':'💣 AI nhận bom!')}
if(st.time<=0)finish();draw()}requestAnimationFrame(loop)}
function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let x=e.clientX-cx,y=e.clientY-cy;const d=Math.hypot(x,y)||1;if(d>max){x=x/d*max;y=y/d*max}st.input={x:x/max,y:y/max};stick.style.transform='translate('+x+'px,'+y+'px)'}
function endJoy(){st.input={x:0,y:0};stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)setJoy(e)});joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
start.addEventListener('click',begin);reset.addEventListener('click',()=>{st.running=false;st.scores=[0,0];s1.textContent='Bạn 0';s2.textContent='AI 0';start.textContent='Bắt đầu round';st.pos=[{x:14,y:50},{x:86,y:50}];st.time=12;endJoy();draw()});addEventListener('resize',draw);draw();requestAnimationFrame(loop)})()
</script>
</body>
</html>
