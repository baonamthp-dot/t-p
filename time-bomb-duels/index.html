<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Time Bomb Duels</title><style>
:root{--bg:#080c16;--panel:#111827;--text:#f7f9ff;--muted:#91a0bd;--blue:#55a9ff;--red:#ff6685;--yellow:#ffd34d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 0,#1a2742,#080c16 70%);font-family:system-ui,sans-serif;color:var(--text);touch-action:none}.wrap{width:min(760px,100vw);height:100dvh;margin:auto;display:flex;flex-direction:column;padding:6px 8px}.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:6px}.title{font-size:18px;font-weight:950;white-space:nowrap}.diff{background:#151f32;color:#fff;border:1px solid #26334d;border-radius:8px;padding:4px 6px;font-size:10px;font-weight:900}.score{display:flex;gap:5px}.score span{background:#151f32;border:1px solid #26334d;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:900}.game{flex:1;min-height:0;background:#0d1422;border:1px solid #25324b;border-radius:14px;padding:6px;display:flex;flex-direction:column}.hud{height:28px;display:grid;grid-template-columns:1fr 54px 1fr;gap:6px;align-items:center}.bar{height:6px;background:#202a40;border-radius:9px;overflow:hidden}.fill{height:100%;transition:width .1s}.p1 .fill{background:var(--blue)}.p2 .fill{background:var(--red)}.timer{text-align:center;font-size:19px;font-weight:1000;color:var(--yellow)}.danger{animation:pulse .3s infinite alternate;color:#ff6378}@keyframes pulse{to{transform:scale(1.12)}}.arena{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:11px;border:1px solid #293752;background:linear-gradient(#14213a,#0a111f)}.grid{position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:38px 38px}.wall{position:absolute;background:#273752;border:1px solid #3a4b6b;border-radius:7px;box-shadow:inset 0 1px #ffffff0a}.player{position:absolute;width:34px;height:38px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:1000;box-shadow:0 6px 16px #0009,0 0 0 2px #ffffff18;z-index:4;transform-origin:center bottom}.player:before{content:"";position:absolute;width:22px;height:14px;top:-8px;border-radius:5px;background:#f2c7a5;box-shadow:0 0 0 2px #0002}.player:after{content:"";position:absolute;bottom:-3px;width:26px;height:5px;border-radius:5px;background:#0005}.one:before{box-shadow:inset 0 -3px #d99b78}.two:before{background:#eab995}.one,.two{transition:filter .12s}.carrier{filter:brightness(1.25) drop-shadow(0 0 8px #ffd34d)}.one{background:var(--blue)}.two{background:var(--red)}.bomb{position:absolute;width:27px;height:27px;border-radius:50%;background:#1e2430;border:3px solid var(--yellow);display:grid;place-items:center;font-size:14px;box-shadow:0 0 16px #ffd34d99,0 4px 8px #0008;z-index:5;animation:bob .55s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}.bomb:after{content:"";position:absolute;width:6px;height:6px;background:#ff6378;border-radius:50%;top:-4px;right:-2px}.badge{position:absolute;right:7px;top:6px;background:#0009;border:1px solid #fff2;padding:3px 6px;border-radius:7px;font-size:9px;font-weight:900;z-index:8}.toast{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(20px,6vw,40px);font-weight:1000;text-shadow:0 4px 18px #000;opacity:0;transition:.15s;z-index:20}.toast.show{opacity:1}.joy{position:absolute;left:10px;bottom:10px;width:86px;height:86px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30;z-index:10;display:grid;place-items:center}.stick{width:38px;height:38px;border-radius:50%;background:#ffffff55;border:2px solid #fff7;position:absolute;left:22px;top:22px;pointer-events:none}.bottom{height:46px;display:flex;align-items:center;justify-content:center;gap:6px}.btn{border:0;border-radius:8px;padding:7px 11px;background:#e9eef8;color:#101522;font-weight:900;font-size:11px}.btn.secondary{background:#202c43;color:white}.hint{font-size:9px;color:var(--muted);text-align:center}@media(max-height:500px){.wrap{padding:4px 6px}.top{height:34px}.title{font-size:15px}.game{padding:4px}.hud{height:22px}.bottom{height:34px}.joy{width:72px;height:72px;left:7px;bottom:7px}.stick{width:32px;height:32px;left:18px;top:18px}.player{width:30px;height:30px;font-size:9px}.bomb{width:22px;height:22px;font-size:11px}.badge{font-size:8px}}</style></head><body><main class="wrap"><header class="top"><div class="title">💣 Time Bomb Duels</div><select id="difficulty" class="diff"><option value="easy">Dễ</option><option value="normal" selected>Trung bình</option><option value="hard">Khó</option><option value="pro">Chuyên nghiệp</option></select><div class="score"><span id="s1">Bạn 0</span><span id="s2">AI 0</span></div></header><section class="game"><div class="hud"><div class="p1"><div class="bar"><div class="fill" id="b1"></div></div></div><div class="timer" id="timer">12.0</div><div class="p2"><div class="bar"><div class="fill" id="b2"></div></div></div></div><div class="arena" id="arena"><div class="grid"></div><div id="walls"></div><div class="badge">🤖 AI</div><div class="round" id="round">Round 1</div><div class="player one" id="p1">BẠN</div><div class="player two" id="p2">AI</div><div class="bomb" id="bomb">💣</div><div class="toast" id="toast"></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div></div><div class="bottom"><button class="btn" id="start">▶ Bắt đầu</button><button class="btn secondary" id="reset">↻ Reset</button><span class="hint">Kéo joystick • Chạm đối thủ để chuyền bom</span></div></section></main><script>
(()=>{const $=s=>document.querySelector(s),arena=$('#arena'),p1=$('#p1'),p2=$('#p2'),bomb=$('#bomb'),timer=$('#timer'),toast=$('#toast'),b1=$('#b1'),b2=$('#b2'),s1=$('#s1'),s2=$('#s2'),start=$('#start'),reset=$('#reset'),joy=$('#joy'),stick=$('#stick');const st={run:false,owner:1,time:12,last:0,score:[0,0],round:1,lastWinner:0,passCooldown:0,p:[{x:10,y:50},{x:90,y:50}],input:{x:0,y:0},skill:1,diff:"normal",maze:0,walls:[]};
const mazes=[
[[18,18,28,7],[54,35,28,7],[20,62,25,7],[57,78,24,7],[43,48,14,7]],
[[12,25,7,55],[31,12,7,40],[50,48,7,40],[69,15,7,42],[82,38,7,48]],
[[18,18,64,7],[18,75,64,7],[18,25,7,35],[75,25,7,35],[45,38,7,24]],
[[12,18,25,7],[63,18,25,7],[36,32,28,7],[12,52,25,7],[63,52,25,7],[36,66,28,7]],
[[20,15,7,28],[43,15,7,28],[66,15,7,28],[31,57,7,28],[54,57,7,28],[77,57,7,28]]
];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function buildMaze(){const box=$("#walls");box.innerHTML="";st.walls=mazes[st.maze].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));st.walls.forEach(a=>{const e=document.createElement("div");e.className="wall";e.style.left=a.x+"%";e.style.top=a.y+"%";e.style.width=a.w+"%";e.style.height=a.h+"%";box.appendChild(e)})}
function blocked(x,y,r=3){return st.walls.some(a=>x+r>a.x&&x-r<a.x+a.w&&y+r>a.y&&y-r<a.y+a.h)}
function moveEntity(q,dx,dy,speed,dt){let nx=clamp(q.x+dx*speed*dt,5,95),ny=clamp(q.y+dy*speed*dt,7,93);if(!blocked(nx,q.y))q.x=nx;if(!blocked(q.x,ny))q.y=ny}
function draw(){const w=arena.clientWidth,h=arena.clientHeight;$("#round").textContent="Round "+st.round;st.p.forEach((q,i)=>{const e=i?p2:p1;e.style.left=q.x/100*w-e.offsetWidth/2+'px';e.style.top=q.y/100*h-e.offsetHeight/2+'px'});const q=st.p[st.owner-1];p1.classList.toggle("carrier",st.owner===1);p2.classList.toggle("carrier",st.owner===2);bomb.style.left=q.x/100*w-bomb.offsetWidth/2+'px';bomb.style.top=q.y/100*h-bomb.offsetHeight/2+'px';b1.style.width=st.owner===1?'100%':'0';b2.style.width=st.owner===2?'100%':'0';timer.textContent=Math.max(0,st.time).toFixed(1);timer.classList.toggle('danger',st.time<4)}
function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),700)}
function begin(){st.diff=$("#difficulty").value;st.maze=Math.floor(Math.random()*mazes.length);buildMaze();st.diff=$("#difficulty").value;st.run=true;st.time=10+Math.random()*4;st.owner=Math.random()<.5?1:2;st.p=[{x:14,y:50},{x:86,y:50}];st.last=performance.now();st.skill={easy:.72,normal:.92,hard:1.12,pro:1.34}[st.diff];start.textContent='● Đang đấu';msg(st.owner===1?'💣 BẠN CẦM BOM':'💣 AI CẦM BOM');draw()}
function finish(){const win=st.owner===1?2:1;st.lastWinner=win;st.score[win-1]++;st.round++;s1.textContent='Bạn '+st.score[0];s2.textContent='AI '+st.score[1];st.run=false;start.textContent='▶ Round tiếp';msg(win===1?'🏆 BẠN THẮNG!':'🤖 AI THẮNG!');draw()}
const aiPath={cells:[],next:0,t:0};function cellBlocked(cx,cy){const x=(cx+.5)*5,y=(cy+.5)*5;return x<5||x>95||y<7||y>93||blocked(x,y,2.2)}function findPath(){const sx=clamp(Math.floor(st.p[1].x/5),0,19),sy=clamp(Math.floor(st.p[1].y/5),1,18),gx=clamp(Math.floor(st.p[0].x/5),0,19),gy=clamp(Math.floor(st.p[0].y/5),1,18),q=[[sx,sy]],prev=new Map(),key=(x,y)=>x+','+y;prev.set(key(sx,sy),null);let end=null;while(q.length){const [x,y]=q.shift();if(Math.abs(x-gx)<=1&&Math.abs(y-gy)<=1){end=[x,y];break}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(nx<0||nx>19||ny<1||ny>18||prev.has(k)||cellBlocked(nx,ny))continue;prev.set(k,[x,y]);q.push([nx,ny])}}if(!end)return;const path=[];let cur=end;while(cur){path.push(cur);cur=prev.get(key(cur[0],cur[1]))}path.reverse();aiPath.cells=path;aiPath.next=path.length>1?1:0}function ai(dt){const me=st.p[1],h=st.p[0];aiPath.t-=dt;if(aiPath.t<=0||!aiPath.cells.length){findPath();aiPath.t=.18}let dx=h.x-me.x,dy=h.y-me.y;if(aiPath.cells.length&&aiPath.next<aiPath.cells.length){const c=aiPath.cells[aiPath.next],tx=(c[0]+.5)*5,ty=(c[1]+.5)*5;dx=tx-me.x;dy=ty-me.y;if(Math.hypot(dx,dy)<2.2){aiPath.next++;if(aiPath.next<aiPath.cells.length){const n=aiPath.cells[aiPath.next];dx=(n[0]+.5)*5-me.x;dy=(n[1]+.5)*5-me.y}}}let len=Math.hypot(dx,dy)||1;const speed={easy:16,normal:22,hard:28,pro:35}[st.diff]*st.skill;moveEntity(me,dx/len,dy/len,speed,dt)}
function loop(now){if(st.run){const dt=Math.min(.035,(now-st.last)/1000);st.last=now;st.time-=dt;st.passCooldown=Math.max(0,st.passCooldown-dt);const h=st.p[0],x=st.input.x,y=st.input.y,m=Math.hypot(x,y);if(m>.04){moveEntity(h,x/m,y/m,29,dt)}ai(dt);if(st.passCooldown<=0&&d(st.p[0],st.p[1])<9){st.owner=st.owner===1?2:1;st.passCooldown=.8;st.time=Math.max(st.time,3.2);msg(st.owner===1?'💣 Bạn nhận bom!':'💣 AI nhận bom!')}if(st.time<=0)finish();draw()}requestAnimationFrame(loop)}
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let x=e.clientX-cx,y=e.clientY-cy,z=Math.hypot(x,y)||1;if(z>max){x=x/z*max;y=y/z*max}st.input={x:x/max,y:y/max};stick.style.transform='translate('+x+'px,'+y+'px)'}function joyEnd(){st.input={x:0,y:0};stick.style.transform='translate(0,0)'}
let joyActive=false;function joyStart(e){e.preventDefault();joyActive=true;if(joy.setPointerCapture)try{joy.setPointerCapture(e.pointerId)}catch(_){}joyMove(e)}function joyDrag(e){if(!joyActive)return;e.preventDefault();joyMove(e)}function joyStop(e){joyActive=false;joyEnd();if(e&&joy.releasePointerCapture)try{joy.releasePointerCapture(e.pointerId)}catch(_){}}
joy.addEventListener('pointerdown',joyStart,{passive:false});joy.addEventListener('pointermove',joyDrag,{passive:false});joy.addEventListener('pointerup',joyStop,{passive:false});joy.addEventListener('pointercancel',joyStop,{passive:false});joy.addEventListener('lostpointercapture',()=>{if(joyActive){joyActive=false;joyEnd()}});
difficulty.onchange=()=>{if(st.run)msg('⚙️ '+difficulty.options[difficulty.selectedIndex].text+' • áp dụng round sau')};start.onclick=begin;reset.onclick=()=>{st.run=false;st.score=[0,0];st.round=1;st.passCooldown=0;s1.textContent='Bạn 0';s2.textContent='AI 0';start.textContent='▶ Bắt đầu';st.p=[{x:10,y:50},{x:90,y:50}];st.time=12;st.walls=[];$('#walls').innerHTML='';joyEnd();draw()};addEventListener('resize',draw);draw();requestAnimationFrame(loop)})()
</script></body></html>
